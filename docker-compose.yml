version: '3.8'

services:
  db_sumapt:
    image: postgres:18-trixie
    container_name: sumapt_postgres
    environment:
      POSTGRES_USER: sumapt_admin
      POSTGRES_PASSWORD: sumapt_password_dev_2026
      POSTGRES_DB: sumapt_db
      # Declaración explícita del directorio de datos para PG 18+
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "5442:5432"
    volumes:
      # CORRECCIÓN: El montaje base ahora se hace un nivel arriba
      - sumapt_pgdata:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
    restart: unless-stopped
    networks:
      - sumapt_network

  iam_sumapt:
    image: quay.io/keycloak/keycloak:26.0
    container_name: sumapt_keycloak
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://db_sumapt:5432/sumapt_db
      KC_DB_USERNAME: sumapt_admin
      KC_DB_PASSWORD: sumapt_password_dev_2026
      KC_DB_SCHEMA: public
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
    command: start-dev
    ports:
      - "8085:8080"
    depends_on:
      - db_sumapt
    restart: unless-stopped
    networks:
      - sumapt_network

volumes:
  sumapt_pgdata:

networks:
  sumapt_network:
    driver: bridge